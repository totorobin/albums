name: B&D photos.cheval-emoi.org

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou tag à déployer"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build --mode chevalemoi

      - name: Copy server files to dist
        run: |
          cp api.php dist/
          cp generate_thumbs.php dist/
          cp .htaccess dist/ 2>/dev/null || true

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CHEVALEMOI_FTP_HOST }}
          username: ${{ secrets.CHEVALEMOI_FTP_USERNAME }}
          password: ${{ secrets.CHEVALEMOI_FTP_PASSWORD }}
          server-dir: ${{ secrets.CHEVALEMOI_FTP_SERVER_DIR }}
          local-dir: ./dist/
